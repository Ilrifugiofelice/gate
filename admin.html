<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Rifugio Felice - Admin</title>
<meta name="theme-color" content="#2e7d32">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #f7f7f2, #e8efe4);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 90%;
  max-width: 420px;
  box-sizing: border-box;
  background: white;
  padding: 26px 22px 22px;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 18px 45px rgba(0,0,0,.18);
  margin: 20px 0;
}

.photo {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
  margin-bottom: 22px;
  background: #e8efe4;
}

.gate {
  margin-top: 16px;
}

button {
  width: 100%;
  padding: 20px;
  font-size: 22px;
  font-weight: 700;
  border: none;
  border-radius: 18px;
  color: white;
  cursor: pointer;
  transition: .25s;
}

#condoButton {
  background: #2e7d32;
  box-shadow: 0 8px 18px rgba(46,125,50,.35);
}

#homeButton {
  background: #6d4c41;
  box-shadow: 0 8px 18px rgba(109,76,65,.35);
}

button:active { transform: scale(.97); }
button.loading { background: #f9a825 !important; }
button.success { background: #1565c0 !important; }
button.warning { background: #c62828 !important; }
button:disabled { cursor: default; box-shadow: none !important; }

.gate-status {
  margin-top: 8px;
  font-size: 15px;
  font-weight: 600;
  min-height: 20px;
  color: #555;
}

.controller {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid #eee;
  font-size: 15px;
  color: #555;
  line-height: 1.6;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #999;
  margin-right: 6px;
}

.dot.online { background: #2e7d32; }
.dot.offline { background: #c62828; }
</style>
</head>

<body>

<div class="card">

  <!-- Carica la foto su GitHub con il nome famiglia.jpg -->
  <img
    src="famiglia.jpg"
    class="photo"
    alt="Famiglia"
    onerror="this.onerror=null; this.src='logo.png';"
  >

  <div class="gate">
    <button id="condoButton">🏢 CANCELLO ESTERNO</button>
    <div class="gate-status" id="condoStatus">Pronto</div>
  </div>

  <div class="gate">
    <button id="homeButton">🏠 CANCELLO CASA</button>
    <div class="gate-status" id="homeStatus">Pronto</div>
  </div>

  <div class="controller">
    <div><span class="dot" id="dot"></span><span id="online">Controllo in corso...</span></div>
    <div id="wifi"></div>
  </div>

</div>

<script>
const DATABASE =
  "https://il-rifugio-felice-default-rtdb.europe-west1.firebasedatabase.app";

const ACK_TIMEOUT_MS = 20000;
const COOLDOWN_SECONDS = 10;
const OFFLINE_AFTER_MS = 150000;   // 2,5 minuti senza segnale

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function firebaseFetch(url, options = {}) {
  return fetch(url, { ...options, cache: "no-store" });
}

// -----------------------------------------------------
// Logica di apertura (identica alla pagina ospiti)
// -----------------------------------------------------

async function readAck(ackUrl) {

  const response = await firebaseFetch(ackUrl + "?t=" + Date.now());
  if (!response.ok) throw new Error("Cannot read Firebase");

  const value = await response.json();
  if (value === null) return -1;

  const executed = Number(value);
  if (!Number.isSafeInteger(executed)) throw new Error("Invalid ACK value");

  return executed;
}

async function createRequest(requestUrl) {

  for (let attempt = 0; attempt < 5; attempt++) {

    const read = await firebaseFetch(requestUrl, {
      headers: { "X-Firebase-ETag": "true" }
    });

    if (!read.ok) throw new Error("Cannot read Firebase");

    const etag = read.headers.get("ETag");
    if (!etag) throw new Error("Firebase ETag unavailable");

    const current = Number((await read.json()) ?? 0);

    if (!Number.isSafeInteger(current) || current < 0) {
      throw new Error("Invalid request ID");
    }

    const nextId = current + 1;

    const write = await firebaseFetch(requestUrl, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "If-Match": etag
      },
      body: JSON.stringify(nextId)
    });

    if (write.ok) return nextId;
    if (write.status !== 412) throw new Error("Cannot write Firebase");

    await sleep(200);
  }

  throw new Error("Too many simultaneous requests");
}

async function waitForAck(ackUrl, requestId, ackBefore) {

  const start = Date.now();

  while (Date.now() - start < ACK_TIMEOUT_MS) {

    try {
      const executed = await readAck(ackUrl);
      if (executed >= requestId && executed > ackBefore) return true;
    } catch (error) {
      console.log("ACK check retry:", error);
    }

    await sleep(800);
  }

  return false;
}

function setupGate(buttonId, statusId, node, label) {

  const button = document.getElementById(buttonId);
  const statusText = document.getElementById(statusId);
  const requestUrl = DATABASE + "/" + node + "/request_id.json";
  const ackUrl = DATABASE + "/" + node + "/last_executed.json";

  function reset() {
    button.classList.remove("loading", "success", "warning");
    button.textContent = label;
    statusText.textContent = "Pronto";
    button.disabled = false;
  }

  async function cooldown() {
    for (let s = COOLDOWN_SECONDS; s > 0; s--) {
      statusText.textContent = "Attendi " + s + " secondi";
      await sleep(1000);
    }
  }

  button.onclick = async () => {

    if (button.disabled) return;

    button.disabled = true;
    button.classList.remove("success", "warning");
    button.classList.add("loading");
    button.textContent = "⏳ INVIO...";
    statusText.textContent = "Invio comando...";

    if (navigator.vibrate) navigator.vibrate(80);

    let requestId, ackBefore;

    try {
      ackBefore = await readAck(ackUrl);
      requestId = await createRequest(requestUrl);
    } catch (error) {
      console.error(error);
      button.classList.remove("loading");
      button.classList.add("warning");
      button.textContent = "⚠️ ERRORE DI RETE";
      statusText.textContent = "Richiesta non inviata. Riprova.";
      await sleep(5000);
      reset();
      return;
    }

    statusText.textContent = "In attesa del controller...";

    const confirmed = await waitForAck(ackUrl, requestId, ackBefore);

    button.classList.remove("loading");

    if (confirmed) {
      button.classList.add("success");
      button.textContent = "✅ COMANDO INVIATO";
      statusText.textContent = "Segnale trasmesso.";
      if (navigator.vibrate) navigator.vibrate([80, 80, 120]);
    } else {
      button.classList.add("warning");
      button.textContent = "⚠️ NESSUNA CONFERMA";
      statusText.textContent = "Controlla il cancello prima di riprovare.";
    }

    await cooldown();
    reset();
  };
}

setupGate("condoButton", "condoStatus", "gate", "🏢 CANCELLO CONDOMINIO");
setupGate("homeButton", "homeStatus", "home_gate", "🏠 CANCELLO CASA");

// -----------------------------------------------------
// Stato del controller ESP32
// -----------------------------------------------------

const dot = document.getElementById("dot");
const onlineText = document.getElementById("online");
const wifiText = document.getElementById("wifi");

function signalQuality(rssi) {
  if (rssi >= -60) return "ottimo";
  if (rssi >= -70) return "buono";
  if (rssi >= -80) return "debole";
  return "molto debole";
}

async function loadStatus() {

  try {

    const response = await firebaseFetch(
      DATABASE + "/status.json?t=" + Date.now()
    );
    const data = await response.json();

    if (!data || !data.last_seen) {
      dot.className = "dot";
      onlineText.textContent = "Controller: nessun dato";
      wifiText.textContent = "";
      return;
    }

    const age = Date.now() - Number(data.last_seen);
    const lastSeen = new Date(Number(data.last_seen))
      .toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

    if (age < OFFLINE_AFTER_MS) {
      dot.className = "dot online";
      onlineText.textContent = "Controller online";
      const rssi = Number(data.rssi);
      wifiText.textContent = Number.isFinite(rssi)
        ? "Wi-Fi: " + rssi + " dBm (" + signalQuality(rssi) + ")"
        : "";
    } else {
      dot.className = "dot offline";
      onlineText.textContent = "Controller offline";
      wifiText.textContent = "Ultimo segnale alle " + lastSeen;
    }

  } catch (error) {
    dot.className = "dot";
    onlineText.textContent = "Stato non disponibile";
    wifiText.textContent = "";
  }
}

loadStatus();
setInterval(loadStatus, 15000);
</script>

</body>
</html>
